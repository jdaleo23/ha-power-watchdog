name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Update manifest.json version
        shell: bash
        run: |
          # Grabs the tag (e.g. v1.0.2) and removes the 'v' (1.0.2)
          VERSION=${GITHUB_REF#refs/tags/v}
          # Updates the JSON file using jq
          jq --arg ver "$VERSION" '.version = $ver' custom_components/hughes_power_watchdog/manifest.json > tmp.json && mv tmp.json custom_components/hughes_power_watchdog/manifest.json
          
      - name: Zip the Integration
        run: |
          cd custom_components/hughes_power_watchdog
          zip -r ../../hughes_power_watchdog.zip .

      - name: Upload Zip to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: hughes_power_watchdog.zip
          asset_name: hughes_power_watchdog.zip
          tag: ${{ github.ref }}
          overwrite: true

      - name: Add feedback footer to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if ! grep -q "helps other people find it" <<< "$body"; then
            footer="$(printf '\n\n## Feedback\n\nFound a bug or have an idea? [Open an issue](https://github.com/%s/issues) or start a [Discussion](https://github.com/%s/discussions).\n\nIf you find the integration useful, a ⭐ on the [repo](https://github.com/%s) helps other people find it.\n' "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY")"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "${body}${footer}"
          fi
